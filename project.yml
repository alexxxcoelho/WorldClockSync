name: WorldClockSync
options:
  bundleIdPrefix: ch.alex
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WorldClockSync:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.alex.WorldClockSync
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WorldClockSync
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Le Bluetooth sert à se connecter à ton horloge pour régler l'heure et le fuseau horaire."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  WorldClockSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WorldClockSync
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
